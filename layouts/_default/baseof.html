<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} | {{ .Site.Title }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a1a; color: #e0e0e0; display: flex; min-height: 100vh; }
    .sidebar { width: 220px; min-height: 100vh; padding: 40px 20px; border-right: 1px solid #333; position: fixed; }
    .sidebar h2 { font-size: 18px; font-weight: 700; margin-bottom: 30px; color: #fff; }
    .sidebar ul { list-style: none; }
    .sidebar ul li a { display: block; padding: 8px 0; color: #aaa; text-decoration: none; font-size: 15px; transition: color 0.2s; }
    .sidebar ul li a:hover { color: #fff; }
    .sidebar ul li.divider { border-top: 1px solid #333; margin: 12px 0; }
    .main { margin-left: 220px; padding: 40px 60px; flex: 1; }
    .post-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .post-meta { font-size: 13px; color: #777; margin-bottom: 24px; }
    .post-content { line-height: 1.8; font-size: 16px; }
    .post-list { list-style: none; }
    .post-list li { padding: 16px 0; border-bottom: 1px solid #2a2a2a; }
    .post-list li a { color: #e0e0e0; text-decoration: none; font-size: 17px; font-weight: 500; }
    .post-list li a:hover { color: #fff; }
    .post-list .meta { font-size: 13px; color: #666; margin-top: 4px; }
    footer { text-align: center; padding: 20px; color: #555; font-size: 12px; }
  </style>
</head>
<body>
  {{ partial "sidebar.html" . }}
  <div class="main">
    {{ block "main" . }}{{ end }}
  </div>
</body>
</html>
